<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo">
            </div>
            <h2>Log In</h2>
            <form action="#" method="get">
                <div class="input-group">
                    <label for="email">Email or phone</label>
                    <input type="email" id="email" name="account" value="" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" value="" required>
                </div>
                <div class="actions">
                    <a href="https://accounts.google.com/signin/v2/usernamerecovery?continue=https%3A%2F%2Fwww.youtube.com%2Fsignin%3Faction_handle_signin%3Dtrue%26app%3Ddesktop%26hl%3Den-IN%26next%3Dhttps%253A%252F%252Fwww.youtube.com%252Faccount%26feature%3Dredirect_login&ddm=0&dsh=S100756080%3A1716521123963866&flowEntry=ServiceLogin&flowName=GlifWebSignIn&hl=en-IN&ifkv=AaSxoQy6zJM_Sbpro5KQ3nfrgYUmXHLmM2K4z-aAr75Wr7g2qAqimzp_X7B1p-7HowWbw7MXO_-yxA&service=youtube
">Forgot password?</a>
                    <hr>
                </div>
              
              <button type="submit" onclick="showAlertAndRedirect()">LOG IN</button>

              <script>
                  function showAlertAndRedirect() {
                      alert('You Log In Successfully!');
                      document.location = 'projectc.html'; } </script>
             
             
              
                
            </form>
            <div class="footer">
                <p>Not your computer? Use Guest mode to sign in privately.</p>
                <a href="   
                https://support.google.com/chrome/answer/6130773?hl=en-GB
                ">Learn more</a>
            </div>
            <hr>
            <div class="create-account">
                <p>Don't have an account?</p>
            
                    <button type="submit" onclick="document.location='newaccount.html'"> Create Account</button>
                    
                
            </div>
        </div>
    </div>
</body>
</html>
